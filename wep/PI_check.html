<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Proforma Invoice Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 20px;
            background: #f4f4f4;
            padding: 15px;
            border-radius: 8px;
            line-height: 1.6;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin: 6px 0;
            font-size: 15px;
        }

        .row span:first-child {
            flex: 1;
        }

        .row span:last-child {
            width: 160px;
            text-align: right;
            white-space: nowrap;
        }

        .error {
            color: #b00020;
            font-weight: bold;
        }

        hr {
            border: 0;
            border-top: 1px solid #ccc;
        }
    </style>
</head>

<body>

    <h2>Proforma Invoice Calculator</h2>

    <label for="startDate">Start Date</label>
    <input type="date" id="startDate">

    <label for="endDate">End Date</label>
    <input type="date" id="endDate">

    <label for="frequencyCharge">Frequency Charge</label>
    <input type="number" id="frequencyCharge" min="0" step="0.01">

    <label for="powerCharge">Power Charge</label>
    <input type="number" id="powerCharge" min="0" step="0.01">

    <button type="button" onclick="calculate()">
        Calculate Invoice
    </button>

    <div class="result" id="result">
        Enter the details and click Calculate Invoice.
    </div>

    <script>
    function parseDateInput(value) {
        if (!value) {
            return null;
        }

        const parts = value.split("-");

        if (parts.length !== 3) {
            return null;
        }

        const year = Number(parts[0]);
        const month = Number(parts[1]) - 1;
        const day = Number(parts[2]);

        const date = new Date(year, month, day);

        if (
            date.getFullYear() !== year ||
            date.getMonth() !== month ||
            date.getDate() !== day
        ) {
            return null;
        }

        return date;
    }

    function daysInMonth(year, monthIndex) {
        return new Date(year, monthIndex + 1, 0).getDate();
    }

    function addCalendarMonths(date, numberOfMonths) {
        const originalDay = date.getDate();

        const targetMonthIndex =
            date.getMonth() + numberOfMonths;

        const targetYear =
            date.getFullYear() +
            Math.floor(targetMonthIndex / 12);

        const normalizedMonth =
            ((targetMonthIndex % 12) + 12) % 12;

        const lastDayOfTargetMonth =
            daysInMonth(targetYear, normalizedMonth);

        const targetDay =
            Math.min(originalDay, lastDayOfTargetMonth);

        return new Date(
            targetYear,
            normalizedMonth,
            targetDay
        );
    }

    function calculateMonthsBetween(start, end) {
        if (end < start) {
            return 0;
        }

        let completeMonths =
            (end.getFullYear() - start.getFullYear()) * 12 +
            (end.getMonth() - start.getMonth());

        let anniversary =
            addCalendarMonths(start, completeMonths);

        if (anniversary > end) {
            completeMonths--;

            anniversary =
                addCalendarMonths(start, completeMonths);
        }

        const remainingDays = Math.round(
            (end - anniversary) / (1000 * 60 * 60 * 24)
        );

        /*
         * Round according to the 15-day rule:
         * 0 to 14 days  = no extra month
         * 15 days or more = extra month
         */
        const additionalMonth =
            remainingDays >= 15 ? 1 : 0;

        return completeMonths + additionalMonth;
    }

    function formatNumber(number) {
        return number.toLocaleString("en-US", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    function calculate() {
        const result = document.getElementById("result");

        const start = parseDateInput(
            document.getElementById("startDate").value
        );

        const end = parseDateInput(
            document.getElementById("endDate").value
        );

        const frequencyCharge =
            parseFloat(
                document.getElementById("frequencyCharge").value
            ) || 0;

        const powerCharge =
            parseFloat(
                document.getElementById("powerCharge").value
            ) || 0;

        if (!start || !end) {
            result.innerHTML =
                '<span class="error">Please enter valid dates.</span>';
            return;
        }

        if (end < start) {
            result.innerHTML =
                '<span class="error">End Date cannot be before Start Date.</span>';
            return;
        }

        if (frequencyCharge < 0 || powerCharge < 0) {
            result.innerHTML =
                '<span class="error">Charges cannot be negative.</span>';
            return;
        }

        // Whole-month result based on the 15-day rule
        const months = calculateMonthsBetween(start, end);

        const fee =
            frequencyCharge + powerCharge;

        const factor =
            (months / 12) * fee;

        const budget =
            factor * 0.20;

        const subTotal =
            factor + budget;

        const vat =
            subTotal * 0.18;

        const stampDuty =
            subTotal < 20000
                ? subTotal * 0.10
                : 2000;

        const total =
            subTotal + vat + stampDuty;

        result.innerHTML = `
            <div>
                <b>Calculated Months:</b> ${months}
            </div>

            <hr>

            <div class="row">
                <span><b>Description</b></span>
                <span><b>Total (Rs.)</b></span>
            </div>

            <hr>

            <div class="row">
                <span>Frequency Charge:</span>
                <span>${formatNumber(frequencyCharge)}</span>
            </div>

            <div class="row">
                <span>Power Charge:</span>
                <span>${formatNumber(powerCharge)}</span>
            </div>

            <div class="row">
                <span>Fee:</span>
                <span>${formatNumber(fee)}</span>
            </div>

            <div class="row">
                <span>Factor (${months}/12):</span>
                <span>${formatNumber(factor)}</span>
            </div>

            <div class="row">
                <span>Budget Proposal (20%):</span>
                <span>${formatNumber(budget)}</span>
            </div>

            <div class="row">
                <span>Sub Total:</span>
                <span>${formatNumber(subTotal)}</span>
            </div>

            <div class="row">
                <span>VAT (18%):</span>
                <span>${formatNumber(vat)}</span>
            </div>

            <div class="row">
                <span>Stamp Duty:</span>
                <span>${formatNumber(stampDuty)}</span>
            </div>

            <hr>

            <div class="row">
                <span><b>Total:</b></span>
                <span><b>${formatNumber(total)}</b></span>
            </div>
        `;
    }
</script>

</body>
</html>
